<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <div class="header">
                <h1 class="title">My Tasks</h1>
                <p class="subtitle" id="date"></p>
            </div>

            <div class="input-container">
                <input
                    type="text"
                    id="todoInput"
                    class="todo-input"
                    placeholder="What needs to be done? Add #labels..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div class="view-controls">
                <div class="view-toggle">
                    <button id="flatViewBtn" class="toggle-btn active">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        Flat
                    </button>
                    <button id="groupedViewBtn" class="toggle-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Grouped
                    </button>
                </div>
            </div>

            <div id="labelFilters" class="label-filters"></div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div id="todoContainer" class="todo-container">
                <ul id="todoList" class="todo-list"></ul>
            </div>

            <div class="stats">
                <span id="taskCount">0 tasks</span>
                <button id="clearCompleted" class="clear-btn">Clear completed</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
